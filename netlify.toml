[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/media/*/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/brand/cafe-icon-v3*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
