name: Build check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run media:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:scroll
      - name: Test actual Netlify production site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TEST_SITE_URL: https://mademoiselle-gourmet-cafe.netlify.app/
        run: npm run test:scroll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-preview-screenshots
          path: test-results/
          if-no-files-found: ignore
